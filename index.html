<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Casa Rede Ronaldo · Em Campo · Miami 2026</title>

<style>
:root{
  --navy:#001A4D; --navy2:#002E8A; --ink:#050A1C; --panel:#060d24;
  --gold:#FFC400; --gold2:#FFD23F;
  --br-blue:#1A6BFF; --br-green:#00B04F; --br-yellow:#FFD000;
  --white:#ffffff; --muted:#9fb0d6; --line:rgba(255,255,255,.10);
  --disp:'Anton',sans-serif; --ui:'Archivo',system-ui,sans-serif; --serif:'Libre Baskerville',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--white);font-family:var(--ui);overflow-x:hidden}
body{min-height:100dvh}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.bg{position:fixed;inset:0;z-index:-2;background:
   radial-gradient(120% 90% at 50% -10%, #0a3aa8 0%, var(--navy) 42%, var(--ink) 100%);}
.bg::after{content:"";position:absolute;inset:0;background:
   radial-gradient(80% 60% at 85% 8%, rgba(26,107,255,.18), transparent 60%),
   radial-gradient(70% 60% at 8% 92%, rgba(0,176,79,.12), transparent 60%);}
.wave{position:fixed;left:0;right:0;z-index:-1;width:100%;height:auto;opacity:.9;pointer-events:none;filter:drop-shadow(0 0 22px rgba(26,107,255,.25))}
.wave.top{top:-2px}
.wave.bottom{bottom:-2px;transform:scaleY(-1)}

/* ---------- STARS ---------- */
.stars{display:flex;gap:6px;justify-content:center;align-items:center}
.stars svg{width:14px;height:14px}
.stars .c{width:19px;height:19px}

/* ---------- BRAND LOCKUP ---------- */
.lock{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.rr{font-family:var(--disp);font-style:italic;font-size:64px;line-height:.8;letter-spacing:-2px;color:#fff;
   text-shadow:0 6px 30px rgba(0,40,138,.6)}
.rr small{display:block;font-style:normal;font-family:var(--ui);font-weight:800;letter-spacing:6px;font-size:11px;margin-top:8px;color:#fff}

/* ---------- GATE ---------- */
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 22px;gap:26px;transition:opacity .5s ease, transform .5s ease}
#gate.hide{opacity:0;transform:scale(1.02);pointer-events:none}
.gate-title{font-family:var(--disp);font-size:clamp(40px,13vw,78px);line-height:.86;text-align:center;letter-spacing:.5px;margin:0}
.gate-title .y{color:var(--gold)}
.gate-sub{font-weight:700;letter-spacing:3px;font-size:11px;color:var(--muted);text-transform:uppercase;text-align:center}
.choose{font-weight:600;letter-spacing:1px;font-size:13px;color:var(--gold2);text-transform:uppercase;margin-top:4px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px}
.lang-btn{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid var(--line);border-radius:16px;
  background:rgba(255,255,255,.04);backdrop-filter:blur(8px);font-weight:700;font-size:15px;cursor:pointer;
  transition:.18s;color:#fff}
.lang-btn:hover,.lang-btn:active{background:rgba(255,196,0,.14);border-color:var(--gold);transform:translateY(-2px)}
.lang-btn .fl{font-size:22px;line-height:1}
.partners{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;text-align:center;opacity:.8;margin-top:6px}

/* ---------- APP HEADER ---------- */
#app{opacity:0;transition:opacity .5s ease;min-height:100dvh;display:flex;flex-direction:column}
#app.show{opacity:1}
header.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:linear-gradient(180deg, rgba(0,12,40,.92), rgba(0,12,40,.55) 80%, transparent);
  backdrop-filter:blur(10px)}
.brand-min{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-min .rrm{font-family:var(--disp);font-style:italic;font-size:24px;letter-spacing:-1px}
.brand-min b{font-weight:800;letter-spacing:3px;font-size:9px;color:var(--muted);text-transform:uppercase}
.langpick{display:flex;gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px}
.langpick button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:1px;
  padding:6px 9px;border-radius:999px;cursor:pointer;text-transform:uppercase}
.langpick button.on{background:var(--gold);color:#06122e}

/* ---------- HOME ---------- */
main{flex:1;width:100%;max-width:680px;margin:0 auto;padding:8px 16px 40px}
.hero{padding:26px 4px 18px;text-align:center}
.hero h1{font-family:var(--disp);font-size:clamp(46px,16vw,92px);line-height:.84;margin:6px 0 0;letter-spacing:1px}
.hero h1 .y{color:var(--gold)}
.hero .intro{color:var(--muted);font-size:15px;line-height:1.5;max-width:30ch;margin:16px auto 0}
.section-label{display:flex;align-items:center;gap:12px;margin:26px 2px 14px;color:var(--gold2);
  font-weight:800;letter-spacing:3px;font-size:12px;text-transform:uppercase}
.section-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}

.cards{display:flex;flex-direction:column;gap:14px}
.card{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid var(--line);
  background:var(--panel);transition:.2s;min-height:148px;display:flex;align-items:flex-end}
.card:hover{transform:translateY(-3px);border-color:rgba(255,196,0,.5)}
.card .ph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.9}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(2,8,24,.15) 0%, rgba(2,8,24,.62) 55%, rgba(2,8,24,.94) 100%)}
.card .body{position:relative;padding:16px 16px 17px;width:100%}
.chip{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.4)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.card h3{font-family:var(--disp);font-size:30px;line-height:.94;margin:9px 0 4px;letter-spacing:.4px}
.card .by{font-size:12.5px;color:#dbe4fb}
.card .by b{color:#fff}
.card .by .rl{color:var(--muted)}
.card .yrs{position:absolute;top:14px;right:15px;font-family:var(--disp);font-size:13px;letter-spacing:1px;color:rgba(255,255,255,.85)}

/* ---------- READER ---------- */
#reader{position:fixed;inset:0;z-index:40;background:var(--ink);overflow-y:auto;transform:translateX(100%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);overscroll-behavior:contain}
#reader.open{transform:translateX(0)}
.r-hero{position:relative;height:46vh;min-height:300px;max-height:480px}
.r-hero .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.r-hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,28,.25) 0%,rgba(5,10,28,.35) 45%,rgba(5,10,28,.96) 100%)}
.r-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.r-back{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(0,12,40,.55);
  backdrop-filter:blur(8px);border-radius:999px;padding:9px 15px;font-weight:800;font-size:12px;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;color:#fff}
.r-meta{position:absolute;left:0;right:0;bottom:0;padding:0 20px 22px;z-index:2}
.r-meta .chip{margin-bottom:12px}
.r-meta h2{font-family:var(--disp);font-size:clamp(40px,12vw,68px);line-height:.86;margin:0 0 12px;letter-spacing:.5px}
.r-narr{font-size:15px;color:#eaf0ff}
.r-narr b{font-weight:800}
.r-narr .rl{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.r-body{max-width:640px;margin:0 auto;padding:26px 22px 30px}
.walltag{display:flex;align-items:center;gap:10px;color:var(--gold2);font-weight:800;letter-spacing:3px;font-size:11px;
  text-transform:uppercase;margin-bottom:16px}
.walltag::before{content:"";width:26px;height:2px;background:var(--gold)}
.r-text{font-family:var(--serif);font-size:18px;line-height:1.72;color:#eef2fc}
.r-text p{margin:0 0 1.05em}
.r-text p:first-letter{}
.r-nav{display:flex;gap:10px;max-width:640px;margin:8px auto 34px;padding:0 22px}
.r-nav button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;border-radius:14px;
  padding:15px 12px;font-weight:800;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.18s}
.r-nav button:hover:not(:disabled){background:rgba(255,196,0,.14);border-color:var(--gold)}
.r-nav button:disabled{opacity:.3;cursor:default}
.r-nav .next{background:var(--gold);color:#06122e;border-color:var(--gold)}
.r-nav .next:hover{filter:brightness(1.05)}

footer{text-align:center;padding:26px 16px 40px;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}
footer .b{color:#fff;font-weight:800}
footer .stars{margin-bottom:14px}
.fade-up{animation:fu .5s ease both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>

<script>
const IMG="https://brunodeluca-alt.github.io/fenomeno50/imgs";
const CH=[{"id": "entrada", "kind": "fachada", "img": "pimg_p00.jpg", "years": "", "tag": {"pt": "FACHADA", "en": "ENTRANCE", "es": "ENTRADA", "fr": "FAÇADE"}, "title": {"pt": "A Entrada", "en": "The Entrance", "es": "La Entrada", "fr": "L’Entrée"}, "narrator": {"pt": "Marcos Uchôa", "en": "Marcos Uchôa", "es": "Marcos Uchôa", "fr": "Marcos Uchôa"}, "role": {"pt": "Jornalista · Veja Mais", "en": "Journalist · Veja Mais", "es": "Periodista · Veja Mais", "fr": "Journaliste · Veja Mais"}, "text": {"pt": "Ronaldinho. Ronaldo. Fenômeno.\n\nComo uma carreira se transforma tanto assim?\n\nDe ser tratado de forma carinhosa a virar algo sinônimo de uma força da natureza?\n\nTodos nós vamos aprendendo muito sobre como defini-lo. Às vezes parece que as palavras não conseguem acompanhar a grandeza da história. Porque toda vez que você acha que tem uma boa definição, uma boa imagem, uma boa frase pra resumir o que foi Ronaldo — aparece uma nova cena que faz tudo parecer pequeno.\n\nRonaldo jogou bola como se a gravidade fosse opcional. Como se os defensores fossem obstáculos de outro esporte. E fez isso carregando um peso que ninguém via: lesões que encerrariam carreiras de qualquer outro. Voltas que pareciam milagre mas eram, na verdade, teimosia pura.\n\nEu cobri Copa do Mundo. Vi Pelé em foto, Maradona ao vivo. Vi Messi virar o maior de todos. Mas de Ronaldo eu guardo algo diferente: a sensação de que o jogo nunca seria suficiente pra ele.\n\nBem-vindo à história do maior artilheiro de Copas do Mundo da história. Bem-vindo à história do Fenômeno.", "en": "Ronaldinho. Ronaldo. Phenomenon.\n\nHow does a career transform so much?\n\nFrom a nickname given with warmth to something synonymous with a force of nature?\n\nAll of us have struggled to define him. Sometimes words cannot keep up with the magnitude of the story. Because every time you think you have the right phrase to sum up what Ronaldo was — a new scene appears that makes everything else seem small.\n\nRonaldo played football as if gravity were optional. As if defenders were obstacles from a different sport. And he did it carrying a weight no one could see: injuries that would have ended any other career. Comebacks that looked like miracles but were, in truth, pure stubbornness.\n\nI covered World Cups. I saw Pelé in photos, Maradona live. I watched Messi become the greatest of all. But with Ronaldo I hold something different: the feeling that the game was never enough for him.\n\nWelcome to the story of the greatest World Cup scorer in history. Welcome to the story of the Phenomenon.", "es": "Ronaldinho. Ronaldo. Fenómeno.\n\n¿Cómo una carrera se transforma tanto?\n\nDe ser un apodo dado con cariño a convertirse en sinónimo de una fuerza de la naturaleza.\n\nTodos hemos luchado por definirlo. A veces las palabras no logran seguir el ritmo de la magnitud de la historia. Porque cada vez que crees tener la frase correcta para resumir lo que fue Ronaldo, aparece una nueva escena que hace que todo lo demás parezca pequeño.\n\nRonaldo jugó al fútbol como si la gravedad fuera opcional. Como si los defensas fueran obstáculos de otro deporte. Y lo hizo cargando un peso que nadie veía: lesiones que habrían terminado con cualquier otra carrera. Regresos que parecían milagros pero eran, en verdad, pura terquedad.\n\nCubrí Copas del Mundo. Vi a Pelé en fotos, a Maradona en vivo. Vi a Messi convertirse en el más grande de todos. Pero de Ronaldo guardo algo diferente: la sensación de que el juego nunca fue suficiente para él.\n\nBienvenido a la historia del máximo goleador de Copas del Mundo de la historia. Bienvenido a la historia del Fenómeno.", "fr": "Ronaldinho. Ronaldo. Phénomène.\n\nComment une carrière peut-elle se transformer autant ?\n\nD’un surnom donné avec tendresse à quelque chose de synonyme d’une force de la nature ?\n\nNous avons tous du mal à le définir. Parfois, les mots n’arrivent pas à suivre la grandeur de l’histoire. Parce que chaque fois qu’on croit avoir la bonne formule pour résumer ce que fut Ronaldo — une nouvelle scène apparaît qui fait paraître tout le reste insignifiant.\n\nRonaldo jouait au football comme si la gravité était optionnelle. Comme si les défenseurs étaient des obstacles d’un autre sport. Et il le faisait en portant un poids que personne ne voyait : des blessures qui auraient mis fin à n’importe quelle autre carrière. Des retours qui semblaient miraculeux mais n’étaient, en vérité, que pure obstination.\n\nJ’ai couvert des Coupes du Monde. J’ai vu Pelé en photo, Maradona en direct. J’ai vu Messi devenir le plus grand de tous. Mais de Ronaldo, je garde quelque chose de différent : le sentiment que le jeu ne lui suffirait jamais.\n\nBienvenue dans l’histoire du meilleur buteur de l’histoire des Coupes du Monde. Bienvenue dans l’histoire du Phénomène."}}, {"id": "p02", "kind": "ato1", "img": "pimg_p02.jpg", "years": "1976—1993", "tag": {"pt": "ATO 1", "en": "ACT 1", "es": "ACTO 1", "fr": "ACTE 1"}, "title": {"pt": "A Origem", "en": "The Origin", "es": "El Origen", "fr": "L’Origine"}, "narrator": {"pt": "Nélio Nazário", "en": "Nélio Nazário", "es": "Nélio Nazário", "fr": "Nélio Nazário"}, "role": {"pt": "Pai", "en": "Father", "es": "Padre", "fr": "Père"}, "text": {"pt": "Meu nome é Nélio. Sou o pai do Ronaldo.\n\nEle nasceu no dia 18 de setembro de 1976. Mas está escrito 22 na certidão. Eu demorei pra registrar e perdi o prazo. Até hoje o mundo comemora no dia errado. Coisa de pai.\n\nAntes de virar Fenômeno, ele foi o caçula. Três filhos numa casa de Bento Ribeiro, uma TV que vivia quebrada. Eu trabalhava na Telerj, técnico de cabos. Final de semana ia pro camelô de Madureira pra fechar o mês.\n\nO Ronaldo pedia vitamina, cuidava do que comia. Quando a Sônia chegava com as queimaduras, ele passava pomada nos braços dela, fazia carinho, e prometia que um dia ia tirar ela daquela vida. Cumpriu.\n\nA gente não tinha quase nada. Mas ele tinha uma bola. E era só o que ele precisava.\n\nPor volta dos 11 anos eu levei ele pra fazer teste no Valqueire Tênis Clube. A fila de ala estava lotada. Aí um técnico chamado Jairzinho viu o menino e disse: “Esse aqui joga diferente.”\n\nEm 1993, com 16 anos, o Ronaldo estreou no Cruzeiro. Eu vi com meus olhos.", "en": "My name is Nélio. I am Ronaldo’s father.\n\nHe was born on September 18, 1976. But the birth certificate says the 22nd. I was late registering him and missed the deadline. To this day the world celebrates on the wrong day. A father’s mistake.\n\nBefore becoming the Phenomenon, he was the youngest. Three kids in a house in Bento Ribeiro, a TV that was always broken. I worked at Telerj as a cable technician. On weekends I sold at the market in Madureira to make ends meet.\n\nRonaldo asked for vitamins, watched what he ate. When Sônia came home with burns, he would rub ointment on her arms, comfort her, and promise that one day he’d take her out of that life. He did.\n\nWe had almost nothing. But he had a ball. And that was all he needed.\n\nAround age 11, I took him to try out at Valqueire Tennis Club. The wing line was packed. Then a coach named Jairzinho saw the boy and said: “This one plays different.”\n\nIn 1993, at 16 years old, Ronaldo made his debut for Cruzeiro. I saw it with my own eyes.", "es": "Me llamo Nélio. Soy el padre de Ronaldo.\n\nNació el 18 de septiembre de 1976. Pero el acta de nacimiento dice el 22. Me demoré en registrarlo y perdí el plazo. Hasta hoy el mundo celebra en el día equivocado. Cosa de padre.\n\nAntes de convertirse en Fenómeno, era el más pequeño. Tres hijos en una casa de Bento Ribeiro, un televisor siempre roto. Trabajaba en Telerj como técnico de cables. Los fines de semana vendía en el mercado de Madureira para llegar a fin de mes.\n\nRonaldo pedía vitaminas, cuidaba lo que comía. Cuando Sônia llegaba con quemaduras, le ponía pomada en los brazos, la consolaba y prometía que algún día la sacaría de esa vida. Lo cumplió.\n\nNo teníamos casi nada. Pero él tenía una pelota. Y era todo lo que necesitaba.\n\nAlrededor de los 11 años lo llevé a hacer una prueba en el Valqueire Tennis Club. La fila de extremos estaba llena. Entonces un entrenador llamado Jairzinho vio al niño y dijo: “Este juega diferente.”\n\nEn 1993, con 16 años, Ronaldo debutó en el Cruzeiro. Lo vi con mis propios ojos.", "fr": "Je m’appelle Nélio. Je suis le père de Ronaldo.\n\nIl est né le 18 septembre 1976. Mais l’acte de naissance indique le 22. J’ai tardé à le déclarer et j’ai raté le délai. Aujourd’hui encore, le monde entier célèbre le mauvais jour. Des choses de père.\n\nAvant de devenir le Phénomène, il était le petit dernier. Trois enfants dans une maison de Bento Ribeiro, une télé toujours en panne. Je travaillais à la Telerj, technicien câbles. Le week-end, je vendais au marché de Madureira pour boucler le mois.\n\nRonaldo demandait des vitamines, faisait attention à ce qu’il mangeait. Quand Sônia rentrait avec des brûlures, il lui passait de la pommade sur les bras, la réconfortait et promettait qu’un jour il la sortirait de cette vie. Il l’a fait.\n\nNous n’avions presque rien. Mais lui, il avait un ballon. Et c’était tout ce dont il avait besoin.\n\nVers 11 ans, je l’ai emmené passer un test au Valqueire Tênis Clube. La file des ailiers était bondée. Alors un entraîneur nommé Jairzinho a vu le gamin et a dit : « Celui-là joue différemment. »\n\nEn 1993, à 16 ans, Ronaldo a débuté à Cruzeiro. Je l’ai vu de mes propres yeux."}}, {"id": "p03", "kind": "ato2", "img": "pimg_p03.jpg", "years": "1993—2001", "tag": {"pt": "ATO 2", "en": "ACT 2", "es": "ACTO 2", "fr": "ACTE 2"}, "title": {"pt": "Ascensão e Queda", "en": "Rise and Fall", "es": "Ascenso y Caída", "fr": "Ascension et Chute"}, "narrator": {"pt": "Zico", "en": "Zico", "es": "Zico", "fr": "Zico"}, "role": {"pt": "Ídolo, amigo pra vida", "en": "Idol, lifelong friend", "es": "Ídolo y amigo de por vida", "fr": "Idole, ami pour la vie"}, "text": {"pt": "Eu era o ídolo daquele garoto. Soube depois. Nunca poderia imaginar que daria um autógrafo pro futuro Fenômeno.\n\nAí em 1993 me chega um pivete magro do Cruzeiro fazendo 56 gols em 58 jogos como profissional. Com 16 anos. Comecei a prestar atenção.\n\nVi ele na Copa de 1994. Convocado por Parreira, nem jogou um minuto. Mas ficou. Aprendeu. Saiu com a medalha no pescoço e fome de mais.\n\nEm 1996, no Barcelona, vi o gol contra o Compostela ao vivo. Aquele drible em todo mundo, a corrida, o gol. Parei e pensei: existe algo além do que eu pensei que era possível.\n\nDepois vieram as lesões. O joelho direito. Duas vezes. A segunda foi em 2000, ao vivo, na TV, o tendão patelar rompendo no Olímpico de Roma. Eu estava na televisão cobrindo. Não conseguia acreditar.\n\nMuita gente achou que tinha acabado. Eu não. Porque eu conhecia o Ronaldo. Sabia do que ele era feito.\n\nA diferença entre o Ronaldo e outros grandes jogadores é que ele voltou. Duas vezes. Isso não é futebol. Isso é caráter.", "en": "I was that boy’s idol. I found out later. I never could have imagined I’d give an autograph to the future Phenomenon.\n\nThen in 1993 this skinny kid from Cruzeiro comes along scoring 56 goals in 58 professional games. At 16 years old. I started paying attention.\n\nI saw him at the 1994 World Cup. Called up by Parreira, he didn’t play a single minute. But he stayed. He learned. He left with a medal around his neck and a hunger for more.\n\nIn 1996 at Barcelona, I saw the goal against Compostela live. That dribble past everyone, the run, the finish. I stopped and thought: there’s something beyond what I thought was possible.\n\nThen came the injuries. The right knee. Twice. The second was in 2000, live on TV, the patellar tendon snapping at the Olimpico in Rome. I was on television covering it. I couldn’t believe what I was watching.\n\nMany people thought it was over. I didn’t. Because I knew Ronaldo. I knew what he was made of.\n\nThe difference between Ronaldo and other great players is that he came back. Twice. That’s not football. That’s character.", "es": "Yo era el ídolo de ese chico. Lo supe después. Nunca hubiera imaginado que le daría un autógrafo al futuro Fenómeno.\n\nLuego, en 1993, llega este chico flaco del Cruzeiro marcando 56 goles en 58 partidos como profesional. Con 16 años. Empecé a prestar atención.\n\nLo vi en el Mundial de 1994. Convocado por Parreira, no jugó ni un minuto. Pero se quedó. Aprendió. Se fue con la medalla al cuello y hambre de más.\n\nEn 1996, en el Barcelona, vi el gol contra el Compostela en vivo. Ese regate a todos, la carrera, el remate. Me detuve y pensé: hay algo más allá de lo que creía posible.\n\nLuego vinieron las lesiones. La rodilla derecha. Dos veces. La segunda en 2000, en vivo por TV, el tendón rotuliano rompiéndose en el Olímpico de Roma. Estaba cubriéndolo en televisión. No podía creer lo que veía.\n\nMucha gente pensó que había terminado. Yo no. Porque conocía a Ronaldo. Sabía de qué estaba hecho.\n\nLa diferencia entre Ronaldo y otros grandes jugadores es que volvió. Dos veces. Eso no es fútbol. Eso es carácter.", "fr": "J’étais l’idole de ce gamin. Je l’ai appris plus tard. Jamais je n’aurais imaginé donner un autographe au futur Phénomène.\n\nPuis, en 1993, ce gamin maigre de Cruzeiro débarque avec 56 buts en 58 matchs en professionnel. À 16 ans. J’ai commencé à faire attention.\n\nJe l’ai vu à la Coupe du Monde 1994. Convoqué par Parreira, il n’a pas joué une seule minute. Mais il est resté. Il a appris. Il est parti avec la médaille au cou et une faim de plus.\n\nEn 1996, au Barcelone, j’ai vu en direct le but contre le Compostelle. Ce dribble sur tout le monde, la course, le but. Je me suis arrêté et j’ai pensé : il existe quelque chose au-delà de ce que je croyais possible.\n\nPuis vinrent les blessures. Le genou droit. Deux fois. La seconde, en 2000, en direct à la télé, le tendon rotulien qui rompt à l’Olimpico de Rome. J’étais à la télévision en train de couvrir. Je n’arrivais pas à y croire.\n\nBeaucoup ont cru que c’était fini. Pas moi. Parce que je connaissais Ronaldo. Je savais de quoi il était fait.\n\nLa différence entre Ronaldo et les autres grands joueurs, c’est qu’il est revenu. Deux fois. Ça, ce n’est pas du football. C’est du caractère."}}, {"id": "p04", "kind": "ato2", "img": "pimg_p04.jpg", "years": "1998—2001", "tag": {"pt": "ATO 2", "en": "ACT 2", "es": "ACTO 2", "fr": "ACTE 2"}, "title": {"pt": "Paris 98 · As Quedas", "en": "Paris 98 · The Falls", "es": "París 98 · Las Caídas", "fr": "Paris 98 · Les Chutes"}, "narrator": {"pt": "Zico", "en": "Zico", "es": "Zico", "fr": "Zico"}, "role": {"pt": "Ídolo de infância, amigo pra vida", "en": "Childhood idol, lifelong friend", "es": "Ídolo de infancia, amigo de por vida", "fr": "Idole d’enfance, ami pour la vie"}, "text": {"pt": "E aí veio 1998.\n\nDia 12 de julho, em Paris, antes da final. Convulsão no quarto do hotel. Ninguém entendeu. Os médicos não entenderam.\n\nEle jogou assim mesmo. Brasil perdeu de 3 a 0. Eu estava no banco, vendo aquilo.\n\nEm novembro de 99, o joelho rompeu em Milão, contra o Lecce. Cinco meses depois, na final da Copa da Itália, rompeu de novo.\n\nO mundo inteiro achou que era o fim.\n\nMas eu olhava pra aquele menino e sentia que um dia ainda ia ligar pra ele. E dizer: Você sabe o que você passou. E aí Deus te deu essa oportunidade.\n\nEu não sabia quando. Só sabia que esse dia ia chegar.\n\nBastou um pra mostrar que não era.\n\nZICO — Na alegria e na tristeza.", "en": "And then came 1998.\n\nJuly 12th, in Paris, before the final. A seizure in the hotel room. Nobody understood. The doctors didn’t understand.\n\nHe played anyway. Brazil lost 3-0. I was on the bench, watching.\n\nIn November 1999, his knee ruptured in Milan, against Lecce. Five months later, in the Coppa Italia final, it ruptured again.\n\nThe whole world thought it was the end.\n\nBut I looked at that boy and felt that one day I would still call him. And say: You know what you went through. And then God gave you this opportunity.\n\nI didn’t know when. I just knew that day would come.\n\nIt only took one to show it wasn’t.\n\nZICO — In joy and in sorrow.", "es": "Y llegó 1998.\n\nEl 12 de julio, en París, antes de la final. Una convulsión en la habitación del hotel. Nadie lo entendió. Los médicos tampoco.\n\nJugó de todas formas. Brasil perdió 3-0. Yo estaba en el banquillo, observando.\n\nEn noviembre de 1999, la rodilla se rompió en Milán, contra el Lecce. Cinco meses después, en la final de la Copa de Italia, se rompió de nuevo.\n\nEl mundo entero pensó que era el final.\n\nPero yo miraba a ese chico y sentía que algún día aún le llamaría. Y le diría: Sabes lo que has pasado. Y Dios te dio esta oportunidad.\n\nNo sabía cuándo. Solo sabía que ese día llegaría.\n\nBastó uno para demostrar que no era el fin.\n\nZICO — En la alegría y en la tristeza.", "fr": "Et puis vint 1998.\n\nLe 12 juillet, à Paris, avant la finale. Une convulsion dans la chambre d’hôtel. Personne n’a compris. Les médecins non plus.\n\nIl a joué quand même. Le Brésil a perdu 3-0. J’étais sur le banc, à regarder ça.\n\nEn novembre 1999, le genou a rompu à Milan, contre Lecce. Cinq mois plus tard, en finale de la Coupe d’Italie, il a rompu de nouveau.\n\nLe monde entier a cru que c’était la fin.\n\nMais je regardais ce garçon et je sentais qu’un jour je l’appellerais encore. Et que je lui dirais : Tu sais ce que tu as traversé. Et alors Dieu t’a donné cette chance.\n\nJe ne savais pas quand. Je savais seulement que ce jour viendrait.\n\nIl a suffi d’une seule fois pour montrer que non.\n\nZICO — Dans la joie et dans la tristesse."}}, {"id": "p05", "kind": "ato3", "img": "pimg_p05.jpg", "years": "2002—2007", "tag": {"pt": "ATO 3", "en": "ACT 3", "es": "ACTO 3", "fr": "ACTE 3"}, "title": {"pt": "O Fenômeno", "en": "The Phenomenon", "es": "El Fenómeno", "fr": "Le Phénomène"}, "narrator": {"pt": "Luiz Felipe Scolari", "en": "Luiz Felipe Scolari", "es": "Luiz Felipe Scolari", "fr": "Luiz Felipe Scolari"}, "role": {"pt": "Felipão · Técnico do Penta", "en": "Felipão · Coach of the Five-Time Champions", "es": "Felipão · Técnico del Penta", "fr": "Felipão · Sélectionneur du Penta"}, "text": {"pt": "Tu é meu camisa 9. Titular. Não tem discussão.\n\nFoi isso que eu falei pro Ronaldo em maio de 2002. Tinha gente que duvidava. Tinha jornalista escrevendo que era loucura. Ele tinha passado quase três anos sem jogar direito por causa do joelho. Muita gente tinha desistido dele.\n\nEu não.\n\nNa Copa de 2002, na Coreia e no Japão, eu vi a ressurreição. Oito gols. Artilheiro. Campeão. Os dois gols na final contra a Alemanha. A foto do abraço depois do apito final — aquilo é de outro mundo.\n\nMas o que mais me marca não é isso. É o que aconteceu antes. É um jogador que, quando todo mundo tinha certeza que ele não ia voltar, treinou como se a Copa dependesse de cada segundo. Porque pra ele, dependia.\n\nEsse é o legado real do Ronaldo: não os gols. A recusa em aceitar o fim.", "en": "You are my number 9. Starter. No discussion.\n\nThat’s what I told Ronaldo in May 2002. There were people who had doubts. Journalists writing that it was madness. He had spent nearly three years unable to play properly because of his knee. Many people had given up on him.\n\nI hadn’t.\n\nAt the 2002 World Cup, in Korea and Japan, I watched the resurrection. Eight goals. Top scorer. Champion. The two goals in the final against Germany. The photo of the embrace after the final whistle — that’s from another world.\n\nBut what stays with me most isn’t that. It’s what happened before. It’s a player who, when everyone was certain he wouldn’t come back, trained as if the World Cup depended on every second. Because for him, it did.\n\nThat’s Ronaldo’s true legacy: not the goals. The refusal to accept the end.", "es": "Tú eres mi número 9. Titular. Sin discusión.\n\nEso fue lo que le dije a Ronaldo en mayo de 2002. Había gente que dudaba. Periodistas escribiendo que era una locura. Había pasado casi tres años sin poder jugar bien por la rodilla. Mucha gente había renunciado a él.\n\nYo no.\n\nEn el Mundial de 2002, en Corea y Japón, vi la resurrección. Ocho goles. Máximo goleador. Campeón. Los dos goles en la final contra Alemania. La foto del abrazo después del pitido final — eso es de otro mundo.\n\nPero lo que más me marca no es eso. Es lo que pasó antes. Es un jugador que, cuando todos estaban seguros de que no volvería, entrenó como si el Mundial dependiera de cada segundo. Porque para él, dependía.\n\nEse es el legado real de Ronaldo: no los goles. La negativa a aceptar el fin.", "fr": "Tu es mon numéro 9. Titulaire. Pas de discussion.\n\nC’est ce que j’ai dit à Ronaldo en mai 2002. Certains doutaient. Des journalistes écrivaient que c’était de la folie. Il avait passé près de trois ans sans pouvoir vraiment jouer à cause du genou. Beaucoup l’avaient abandonné.\n\nPas moi.\n\nÀ la Coupe du Monde 2002, en Corée et au Japon, j’ai vu la résurrection. Huit buts. Meilleur buteur. Champion. Les deux buts en finale contre l’Allemagne. La photo de l’étreinte après le coup de sifflet final — ça, c’est d’un autre monde.\n\nMais ce qui me marque le plus, ce n’est pas ça. C’est ce qui s’est passé avant. C’est un joueur qui, alors que tout le monde était certain qu’il ne reviendrait pas, s’est entraîné comme si la Coupe dépendait de chaque seconde. Parce que pour lui, elle en dépendait.\n\nVoilà le véritable héritage de Ronaldo : non pas les buts. Le refus d’accepter la fin."}}, {"id": "p06", "kind": "ato4", "img": "pimg_p06.jpg", "years": "2007—2011", "tag": {"pt": "ATO 4", "en": "ACT 4", "es": "ACTO 4", "fr": "ACTE 4"}, "title": {"pt": "O Homem", "en": "The Man", "es": "El Hombre", "fr": "L’Homme"}, "narrator": {"pt": "David Beckham", "en": "David Beckham", "es": "David Beckham", "fr": "David Beckham"}, "role": {"pt": "Companheiro no Real Madrid", "en": "Real Madrid teammate", "es": "Compañero en el Real Madrid", "fr": "Coéquipier au Real Madrid"}, "text": {"pt": "O ídolo precisou virar homem.\n\nEu joguei com o Ronaldo no Real Madrid. Quando cheguei, em 2003, levei um tempo pra me adaptar. A Espanha era outra língua, outra cultura, um novo lugar pra mim e pra minha família. Foi o Ronaldo quem me acolheu e ajudou a todos nós. Sempre, sem pose de estrela.\n\nEle nos chamava pra churrasco, nos apresentou o Brasil dentro da Espanha, ajudou minha família a se sentir em casa.\n\nRonaldo é o jogador mais completo que eu já vi. Mas o que eu mais admiro é o homem.\n\nSomos amigos para a vida toda. Vivemos uma bela história dentro e fora de campo, e seguimos vivendo. Tudo o que passamos juntos fica comigo para sempre.", "en": "The idol had to become a man.\n\nI played with Ronaldo at Real Madrid. When I arrived in 2003, it took me time to adjust. Spain was a different language, a different culture, a new place for me and my family to call home. It was Ronaldo who welcomed us and helped us all. Always, without any star attitude.\n\nHe called us for barbecues, introduced us to Brazil within Spain, helped my family feel at home.\n\nRonaldo is the most complete player I have ever seen. But what I admire most is the man.\n\nWe are friends for life. We lived a beautiful story on and off the pitch, and we keep on living it. Everything we’ve been through together stays with me forever.", "es": "El ídolo tuvo que convertirse en hombre.\n\nJugué con Ronaldo en el Real Madrid. Cuando llegué en 2003, me llevó tiempo adaptarme. España era otro idioma, otra cultura, un nuevo lugar para mí y para mi familia. Fue Ronaldo quien nos acogió y nos ayudó a todos. Siempre, sin actitud de estrella.\n\nNos llamaba para asados, nos presentó Brasil dentro de España, ayudó a que mi familia se sintiera en casa.\n\nRonaldo es el jugador más completo que he visto jamás. Pero lo que más admiro es al hombre.\n\nSomos amigos de por vida. Vivimos una hermosa historia dentro y fuera del campo, y seguimos viviéndola. Todo lo que hemos pasado juntos se queda conmigo para siempre.", "fr": "L’idole a dû devenir un homme.\n\nJ’ai joué avec Ronaldo au Real Madrid. Quand je suis arrivé, en 2003, il m’a fallu du temps pour m’adapter. L’Espagne, c’était une autre langue, une autre culture, un nouvel endroit à appeler maison, pour moi et ma famille. C’est Ronaldo qui nous a accueillis et nous a tous aidés. Toujours, sans la moindre pose de star.\n\nIl nous invitait à des churrascos, nous a présenté le Brésil au cœur de l’Espagne, a aidé ma famille à se sentir chez elle.\n\nRonaldo est le joueur le plus complet que j’aie jamais vu. Mais ce que j’admire le plus, c’est l’homme.\n\nNous sommes amis pour la vie. Nous avons vécu une belle histoire sur le terrain et en dehors, et nous continuons de la vivre. Tout ce que nous avons traversé ensemble reste avec moi pour toujours."}}, {"id": "p07", "kind": "ato5", "img": "pimg_p07.jpg", "years": "2012—2026", "tag": {"pt": "ATO 5", "en": "ACT 5", "es": "ACTO 5", "fr": "ACTE 5"}, "title": {"pt": "De Volta Pra Casa", "en": "Back Home", "es": "De Vuelta a Casa", "fr": "Retour à la Maison"}, "narrator": {"pt": "Dona Sônia", "en": "Dona Sônia", "es": "Doña Sônia", "fr": "Dona Sônia"}, "role": {"pt": "Mãe", "en": "Mother", "es": "Madre", "fr": "Mère"}, "text": {"pt": "Eu sou a Sônia. Sou a mãe do Ronaldo.\n\nQuando ele parou de jogar, em 2011, eu pensei que finalmente ele ia descansar. Não tinha acabado nada. O Ronaldo nunca soube ficar parado.\n\nEm 2018 virou presidente do Real Valladolid na Espanha. Em 2019, ganhou o Globe Soccer Award. Em 2022 voltou pro Cruzeiro, onde tudo começou.\n\nEle criou uma fundação pra cuidar de gente. A missão é a cara dele: encontrar fenômenos espalhados por todo canto do Brasil, gente cheia de talento e sem oportunidade. Já são 15 anos nisso. Mais de 750 mil pessoas alcançadas.\n\nA maior conquista do nosso pai não está em nenhum título ou prêmio que vocês viram aqui. O que mais me orgulha é o tipo de pessoa que ele é.\n\nEle nasceu pra ser o Ronaldo. Cinquenta anos do meu menino.", "en": "I am Sônia. I am Ronaldo’s mother.\n\nWhen he stopped playing in 2011, I thought he would finally rest. It wasn’t over at all. Ronaldo never knew how to stay still.\n\nIn 2018 he became president of Real Valladolid in Spain. In 2019, he won the Globe Soccer Award. In 2022 he returned to Cruzeiro, where it all began.\n\nHe created a foundation to care for people. The mission is just like him: find phenomena scattered across Brazil, people full of talent without opportunity. It’s been 15 years of this. More than 750,000 people reached.\n\nRonaldo’s greatest achievement isn’t in any title or award you’ve seen here. What I’m most proud of is the kind of person he is.\n\nHe was born to be Ronaldo. Fifty years of my boy.", "es": "Soy Sônia. Soy la madre de Ronaldo.\n\nCuando dejó de jugar en 2011, pensé que finalmente descansaría. No había terminado nada. Ronaldo nunca supo quedarse quieto.\n\nEn 2018 se convirtió en presidente del Real Valladolid, en España. En 2019 ganó el Globe Soccer Award. En 2022 regresó al Cruzeiro, donde todo comenzó.\n\nCreó una fundación para cuidar a la gente. La misión es justo como él: encontrar fenómenos repartidos por todo Brasil, gente llena de talento y sin oportunidad. Ya son 15 años en esto. Más de 750.000 personas alcanzadas.\n\nEl mayor logro de nuestro padre no está en ningún título o premio que hayan visto aquí. De lo que más me enorgullezco es del tipo de persona que es.\n\nNació para ser Ronaldo. Cincuenta años de mi niño.", "fr": "Je suis Sônia. Je suis la mère de Ronaldo.\n\nQuand il a arrêté de jouer, en 2011, j’ai cru qu’il allait enfin se reposer. Rien n’était fini. Ronaldo n’a jamais su rester en place.\n\nEn 2018, il est devenu président du Real Valladolid, en Espagne. En 2019, il a remporté le Globe Soccer Award. En 2022, il est retourné à Cruzeiro, là où tout a commencé.\n\nIl a créé une fondation pour prendre soin des gens. La mission lui ressemble : trouver des phénomènes éparpillés dans tout le Brésil, des gens pleins de talent et sans opportunité. Cela fait déjà 15 ans. Plus de 750 000 personnes touchées.\n\nLa plus grande réussite de notre père ne se trouve dans aucun titre ni aucun trophée que vous avez vus ici. Ce qui me rend la plus fière, c’est le genre de personne qu’il est.\n\nIl est né pour être Ronaldo. Cinquante ans de mon garçon."}}, {"id": "p08", "kind": "anos", "img": "pimg_p08.jpg", "years": "2026", "tag": {"pt": "50 ANOS", "en": "50 YEARS", "es": "50 AÑOS", "fr": "50 ANS"}, "title": {"pt": "Em Nome do Nós", "en": "In Our Name", "es": "En Nuestro Nombre", "fr": "En Notre Nom"}, "narrator": {"pt": "Os Filhos", "en": "The Children", "es": "Los Hijos", "fr": "Les Enfants"}, "role": {"pt": "Alex, Maria Alice, Maria Sophia e Ronald", "en": "Alex, Maria Alice, Maria Sophia and Ronald", "es": "Alex, María Alice, María Sophia y Ronald", "fr": "Alex, Maria Alice, Maria Sophia et Ronald"}, "text": {"pt": "Crescer sendo filho do Fenômeno é diferente. De um jeito que só a gente sabe.\n\nA gente não cresceu embaixo do mesmo teto. Mas todos fomos criados juntos. Existe uma cumplicidade entre nós que não precisa de explicação. A gente sabe as dores de carregar esse nome, e sabe as alegrias.\n\nE tem uma coisa que a gente precisa falar: temos muito orgulho de sermos brasileiros. Quando estamos fora do Brasil e alguém fala Ronaldo Nazário, e a gente descobre que somos filhos dele, o impacto nunca nos surpreende. O brilho naqueles olhos de quem nos descobre, o amor que ele transbordou e ainda nos encontra.\n\nEntão se for pra sair dessa experiência levando algo, não é a história dele que você carrega. É a sua.\n\nCom amor — Ronald, Alex, Maria Sophia e Maria Alice Nazário", "en": "Growing up as children of the Phenomenon is different. In a way that only we understand.\n\nWe didn’t all grow up under the same roof. But we were all raised together. There’s a bond between us that needs no explanation. We know the weight of carrying this name, and we know the joy.\n\nAnd there’s one thing we need to say: we are very proud to be Brazilian. When we’re outside Brazil and someone says Ronaldo Nazário, and they discover we are his children, the impact never surprises us. The shine in the eyes of those who discover us, the love he poured out that still finds us.\n\nSo if you’re going to leave this experience carrying something, it’s not his story you carry. It’s yours.\n\nWith love — Ronald, Alex, Maria Sophia and Maria Alice Nazário", "es": "Crecer siendo hijos del Fenómeno es diferente. De una manera que solo nosotros entendemos.\n\nNo todos crecimos bajo el mismo techo. Pero todos fuimos criados juntos. Hay un vínculo entre nosotros que no necesita explicación. Conocemos el peso de llevar este nombre, y conocemos la alegría.\n\nY hay una cosa que necesitamos decir: estamos muy orgullosos de ser brasileños. Cuando estamos fuera de Brasil y alguien dice Ronaldo Nazário, y descubren que somos sus hijos, el impacto nunca nos sorprende. El brillo en los ojos de quienes nos descubren, el amor que él derramó y que todavía nos encuentra.\n\nEntonces, si vas a salir de esta experiencia llevando algo, no es su historia lo que llevas. Es la tuya.\n\nCon amor — Ronald, Alex, María Sophia y María Alice Nazário", "fr": "Grandir en étant fils du Phénomène, c’est différent. D’une manière que nous seuls savons.\n\nNous n’avons pas grandi sous le même toit. Mais nous avons tous été élevés ensemble. Il existe entre nous une complicité qui n’a pas besoin d’explication. Nous connaissons les douleurs de porter ce nom, et nous en connaissons les joies.\n\nEt il y a une chose que nous devons dire : nous sommes très fiers d’être brésiliens. Quand nous sommes hors du Brésil et que quelqu’un dit Ronaldo Nazário, et qu’il découvre que nous sommes ses enfants, l’impact ne nous surprend jamais. L’éclat dans les yeux de ceux qui nous découvrent, l’amour qu’il a fait déborder et qui nous rejoint encore.\n\nAlors si vous deviez repartir de cette expérience avec quelque chose, ce n’est pas son histoire que vous emportez. C’est la vôtre.\n\nAvec amour — Ronald, Alex, Maria Sophia et Maria Alice Nazário"}}];
const UI={"pt": {"choose": "Escolha o seu idioma", "start": "Começar a visita", "journey": "O PERCURSO", "back": "Percurso", "prev": "Anterior", "next": "Próximo", "wall": "TEXTO DE PAREDE", "intro": "A história do Fenômeno, contada por quem viveu ao lado dele.", "of": "de", "langname": "Português"}, "en": {"choose": "Choose your language", "start": "Start the tour", "journey": "THE JOURNEY", "back": "Journey", "prev": "Previous", "next": "Next", "wall": "WALL TEXT", "intro": "The story of the Phenomenon, told by those who lived it beside him.", "of": "of", "langname": "English"}, "es": {"choose": "Elige tu idioma", "start": "Comenzar la visita", "journey": "EL RECORRIDO", "back": "Recorrido", "prev": "Anterior", "next": "Siguiente", "wall": "TEXTO DE PARED", "intro": "La historia del Fenómeno, contada por quienes la vivieron a su lado.", "of": "de", "langname": "Español"}, "fr": {"choose": "Choisissez votre langue", "start": "Commencer la visite", "journey": "LE PARCOURS", "back": "Parcours", "prev": "Précédent", "next": "Suivant", "wall": "TEXTE MURAL", "intro": "L’histoire du Phénomène, racontée par ceux qui l’ont vécue à ses côtés.", "of": "sur", "langname": "Français"}};
const KC={"fachada": "#ffc400", "ato1": "#3b82f6", "ato2": "#22c55e", "ato3": "#f59e0b", "ato4": "#a855f7", "ato5": "#ec4899", "anos": "#ffc400"};
let LANG="pt", cur=0;

/* ---- gate ---- */
document.querySelectorAll('.lang-btn').forEach(b=>{
  b.addEventListener('click',()=>enter(b.dataset.l));
});
function enter(l){
  LANG=l;
  document.getElementById('gate').classList.add('hide');
  setTimeout(()=>{ document.getElementById('gate').style.display='none'; },520);
  document.getElementById('app').classList.add('show');
  render();
  // deep-link support after entering
  routeFromHash(true);
}

/* ---- language pickers ---- */
function buildPicker(el){
  el.innerHTML='';
  ['pt','en','es','fr'].forEach(l=>{
    const b=document.createElement('button');
    b.textContent=l.toUpperCase(); b.className=(l===LANG?'on':'');
    b.onclick=()=>{ LANG=l; render(); if(document.getElementById('reader').classList.contains('open')) openReader(cur,true); };
    el.appendChild(b);
  });
}

/* ---- render home ---- */
function render(){
  const u=UI[LANG];
  document.getElementById('introLbl').textContent=u.intro;
  document.getElementById('journeyLbl').textContent=u.journey;
  document.getElementById('backLbl').textContent=u.back;
  document.getElementById('wallLbl').textContent=u.wall;
  document.getElementById('btnPrev').textContent='‹ '+u.prev;
  document.getElementById('btnNext').textContent=u.next+' ›';
  buildPicker(document.getElementById('langpick'));
  buildPicker(document.getElementById('langpick2'));
  const wrap=document.getElementById('cards'); wrap.innerHTML='';
  CH.forEach((c,i)=>{
    const col=KC[c.kind]||'#ffc400';
    const card=document.createElement('div'); card.className='card fade-up';
    card.style.animationDelay=(i*45)+'ms';
    card.onclick=()=>openReader(i);
    card.innerHTML=`
      <div class="ph" style="background-image:url('${IMG}/${c.img}')"></div>
      <div class="shade"></div>
      ${c.years?`<div class="yrs">${c.years}</div>`:''}
      <div class="body">
        <span class="chip"><span class="dot" style="background:${col}"></span>${c.tag[LANG]}</span>
        <h3>${c.title[LANG]}</h3>
        <div class="by"><b>${c.narrator[LANG]}</b> <span class="rl">· ${c.role[LANG]}</span></div>
      </div>`;
    wrap.appendChild(card);
  });
}

/* ---- reader ---- */
function openReader(i,keep){
  cur=i; const c=CH[i]; const col=KC[c.kind]||'#ffc400';
  document.getElementById('rPh').style.backgroundImage=`url('${IMG}/${c.img}')`;
  document.getElementById('rChip').innerHTML=`<span class="dot" style="background:${col};width:7px;height:7px;border-radius:50%;display:inline-block"></span> ${c.tag[LANG]}${c.years?(' · '+c.years):''}`;
  document.getElementById('rTitle').textContent=c.title[LANG];
  document.getElementById('rNarr').textContent=c.narrator[LANG];
  document.getElementById('rRole').textContent=c.role[LANG];
  const txt=c.text[LANG].split('\n\n').map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
  document.getElementById('rText').innerHTML=txt;
  document.getElementById('btnPrev').disabled=(i===0);
  document.getElementById('btnNext').disabled=(i===CH.length-1);
  const r=document.getElementById('reader');
  r.classList.add('open'); if(!keep){ r.scrollTop=0; }
  buildPicker(document.getElementById('langpick2'));
  if(!keep) location.hash=c.id;
}
function nav(d){ const n=cur+d; if(n>=0&&n<CH.length) openReader(n); }
function closeReader(){ document.getElementById('reader').classList.remove('open'); history.replaceState(null,'',location.pathname); }
function goHome(){ closeReader(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---- hash routing (QR deep-link ready) ---- */
function routeFromHash(initial){
  const h=location.hash.replace('#','');
  const idx=CH.findIndex(c=>c.id===h);
  if(idx>=0){ openReader(idx); }
}
window.addEventListener('hashchange',()=>{ if(document.getElementById('app').classList.contains('show')) routeFromHash(); });

/* keyboard */
document.addEventListener('keydown',e=>{
  if(!document.getElementById('reader').classList.contains('open'))return;
  if(e.key==='ArrowRight')nav(1);
  if(e.key==='ArrowLeft')nav(-1);
  if(e.key==='Escape')closeReader();
});
</script>
</body>
</html>
